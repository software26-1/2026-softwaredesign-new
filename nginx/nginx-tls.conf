worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server backend:8080;
    }

    # Proxy headers applied to every location in the TLS server below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Port 80: ACME(Let's Encrypt) challenge + redirect everything else to HTTPS ----
    server {
        listen 80;
        server_name _;

        # certbot webroot challenge (mount the webroot at /var/www/certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Port 443: TLS termination + reverse proxy to Spring Boot ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Mount certs into the nginx container at these paths
        # (e.g. Let's Encrypt: /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /api/            { proxy_pass http://backend; }
        location /oauth2/         { proxy_pass http://backend; }
        location /login/oauth2/   { proxy_pass http://backend; }
        location /swagger-ui/     { proxy_pass http://backend; }
        location /api-docs/       { proxy_pass http://backend; }
        location /actuator/       { proxy_pass http://backend; }

        # Root: frontend lives on Vercel, return a simple health message.
        location / {
            default_type text/plain;
            return 200 "School Management API gateway (TLS). Frontend is served on Vercel.\n";
        }
    }
}
