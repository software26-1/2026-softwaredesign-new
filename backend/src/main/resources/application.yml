spring:
  application:
    name: schoolsystem

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school_mgmt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis1234}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-consumer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "com.softwaredesign.schoolsystem.*"

server:
  port: 8080
  # nginx(TLS) 프록시 뒤에서 X-Forwarded-* 를 신뢰 → OAuth redirect_uri를 https로 생성
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: schoolsystem

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  aes:
    secret-key: ${AES_SECRET_KEY:01234567890123456789012345678901}
  cors:
    # 콤마로 구분된 허용 오리진 목록 (운영 도메인 추가). allowCredentials=true 이므로 와일드카드 불가
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  chatbot:
    enabled: ${CHATBOT_ENABLED:false}
  notification:
    email:
      enabled: ${NOTIF_EMAIL_ENABLED:false}
      from: ${SES_FROM_EMAIL:no-reply@example.com}
      region: ${AWS_REGION:ap-northeast-2}
    push:
      enabled: ${NOTIF_PUSH_ENABLED:false}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  report:
    s3:
      # true 이면 보고서 파일을 S3에 업로드(경로 s3://bucket/key), false면 로컬 저장
      enabled: ${REPORT_S3_ENABLED:false}
      bucket: ${REPORT_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}

logging:
  level:
    org.springframework.security: DEBUG
    com.softwaredesign.schoolsystem: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
