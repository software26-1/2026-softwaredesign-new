name: Deploy Backend

# main 브랜치에 backend 변경이 머지되면 이미지를 빌드해 GHCR에 푸시하고 EC2에 배포한다.
# 필요한 GitHub Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (개인키), (선택) EC2_APP_DIR
# 배포 단계 활성화: 저장소 Variables 에 DEPLOY_ENABLED=true 설정
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - docker-compose.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          echo "tag=${IMAGE,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # EC2 배포는 저장소 Variable DEPLOY_ENABLED=true 일 때만 수행(미설정 시 이미지 푸시까지만).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-$HOME/2026-softwaredesign-new}"
            cd "$APP_DIR"
            git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE="$(echo 'ghcr.io/${{ github.repository }}-backend' | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::7}"
            docker compose pull backend
            docker compose up -d backend nginx
            docker image prune -f
